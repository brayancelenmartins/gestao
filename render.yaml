# Configuração do Render (Blueprint). O Render lê este arquivo automaticamente.
services:
  - type: web
    name: clinica-estetica
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Faz as rotas (/clientes, /agenda...) funcionarem ao recarregar a página
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_NOME_CLINICA
        sync: false
